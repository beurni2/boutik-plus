name: expo-preview

# WO-4.0 — the founder's window: publish-on-merge to the Expo "preview"
# channel. The job SKIPS GRACEFULLY (with a visible annotation) while the
# EXPO_TOKEN secret is absent; the founder adds it in repo settings to arm
# the channel. The token is referenced ONLY as a secret via env — it appears
# in no committed file, no echoed log line, no lockfile (scan-gated).

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      root:
        description: "Racine à publier ('' = défaut V2 · 'e1' = app E1, dispatch-only — founder ruling 2026-07-17)"
        required: false
        default: ''

# DEPLOI-VERROU-1 (AUDIT-B+2 F-17) — this job reads the tree; it publishes to
# Expo with EXPO_TOKEN, never with the repository's own token.
permissions:
  contents: read

jobs:
  publish-preview:
    # DEPLOI-VERROU-1 (verifier, slice 4) — a publish to the founder's preview
    # channel is a deploy too: only main may publish, whether by the push to
    # main or by a dispatch. A dispatch from any other branch is skipped.
    # (Not the ci-green check the four deploys run: ci is still running when
    # the push to main fires this.)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # DEPLOI-VERROU-1 (F-17) — EXPO_TOKEN is no longer set for the whole job,
    # where every step (and every action) could read it: only the presence
    # check and the publish step hold it.
    steps:
      # AUDIT-B+1 F10 — THIS JOB COULD REPORT SUCCESS WITH EVERY STEP SKIPPED.
      #
      # Every step below carries `if: steps.token.outputs.present == 'true'`,
      # so an absent token produced a green tick and published nothing. The
      # graceful skip was deliberate and correct WHILE the channel was being
      # armed — but it is armed: run 31041929646 published for 77 seconds. From
      # here the only thing the skip can hide is a token that was rotated or
      # expired, and it would hide it behind a green tick on every push.
      #
      # So the skip now depends on WHO IS WATCHING. On `push` to main nobody is
      # looking, and silence is indistinguishable from success — that is an
      # error. On `workflow_dispatch` a human ran this on purpose and can read a
      # notice, so the escape hatch stays for them.
      #
      # ⚠ FOUNDER RULING (2026-08-06): main must NOT go red for an
      # infrastructure reason. The `exit 1` on push is REVERTED — an absent
      # token is a loud WARNING annotation, never a failed build.
      #
      # THE DEFECT THAT RETURNS WITH IT, on the record: this job can complete
      # "successfully" having published nothing, because every step below is
      # conditioned on the token. `::warning` surfaces on the run and in the
      # commit's checks, which is a real signal but a missable one.
      #
      # HOW TO CATCH IT WITHOUT A RED BUILD: the publish step's DURATION is the
      # tell — a genuine publish takes ~75 s, a skipped one is instant. If
      # previews stop appearing, open the latest run and look at whether the
      # publish step ran at all before assuming the build is fine.
      - name: Check EXPO_TOKEN presence (skip gracefully when absent)
        id: token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            if [ "${{ github.event_name }}" = "push" ]; then
              echo "::warning title=Aperçu Expo NON publié::Le secret EXPO_TOKEN est absent ou expiré — RIEN n'a été publié pour ce push. Réarmer le secret dans Settings → Secrets (voir PREVIEW.md)."
            else
              echo "::notice title=Aperçu Expo non publié::Le secret EXPO_TOKEN n'est pas configuré — l'ajouter dans Settings → Secrets pour armer la publication automatique (voir PREVIEW.md)."
            fi
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: steps.token.outputs.present == 'true'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0 (what the moving v4 resolves to)
        if: steps.token.outputs.present == 'true'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.token.outputs.present == 'true'
        with:
          node-version: 22
          cache: pnpm
      # DEPLOI-VERROU-1 (F-17) — the scoped platform-contracts grant (ci.yml).
      - name: Install (frozen lockfile) with a scoped platform-contracts grant, discarded after
        if: steps.token.outputs.present == 'true'
        env:
          GIT_CONFIG_GLOBAL: ${{ runner.temp }}/platform-contracts.gitconfig
          PLATFORM_CONTRACTS_READ_TOKEN: ${{ secrets.PLATFORM_CONTRACTS_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${PLATFORM_CONTRACTS_READ_TOKEN}" ]; then
            B="https://x-access-token:${PLATFORM_CONTRACTS_READ_TOKEN}@github.com/beurni2/platform-contracts"
            git config --global url."$B".insteadOf "https://github.com/beurni2/platform-contracts"
            git config --global --add url."$B".insteadOf "git@github.com:beurni2/platform-contracts"
            git config --global --add url."$B".insteadOf "ssh://git@github.com/beurni2/platform-contracts"
          fi
          trap 'rm -f "$GIT_CONFIG_GLOBAL"' EXIT
          pnpm install --frozen-lockfile
      - name: Publish supplier-app preview update (EAS, non-interactive)
        if: steps.token.outputs.present == 'true'
        working-directory: apps/supplier-app
        # The documented non-interactive chain: init links/creates the
        # project under the token's account on first run; update:configure
        # writes the runtime/update config into the CI workspace only
        # (ephemeral — never committed); update publishes to the preview
        # channel. First REAL publish is founder-verified on his phone.
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          # Founder ruling 2026-07-17: V2 is the registered preview root — the
          # DEFAULT (main-push and bare dispatch) publishes 'v2'. E1 stays
          # reachable dispatch-only via root=e1 (index.ts mounts E1 for any
          # value other than 'v2'). App code untouched by this flip.
          EXPO_PUBLIC_ROOT: ${{ github.event.inputs.root || 'v2' }}
          # SUPPLIER-AUTHORING-1 — the LIVE offer-service base, inlined into the
          # bundle by babel-preset-expo exactly as EXPO_PUBLIC_ROOT is.
          # CLE-FONDATEUR-1 (AUDIT-B+2 F-01): the shared write key that used to
          # ride here is RETIRED — no credential is built into the bundle any
          # more. Authoring now needs the founder's operator key,
          # typed on his own device; the parked native preview has no key door,
          # so it authors nothing (its screens say so), never invented products.
          EXPO_PUBLIC_OFFER_BASE: ${{ secrets.EXPO_PUBLIC_OFFER_BASE }}
          # COMBINED SLICE — the media pair, mirroring the offer pair exactly:
          # BASE is the media-service URL, WRITE_KEY is the value of
          # MEDIA_WRITE_SECRET. Both must be set for photographs to upload;
          # unset resolves to null and the product publishes with the honest
          # assetRefs: [] (completion path adds photos later). Same whitespace
          # law: a trailing space or newline stored in the secret 401s the
          # correct key forever.
          EXPO_PUBLIC_MEDIA_BASE: ${{ secrets.EXPO_PUBLIC_MEDIA_BASE }}
          EXPO_PUBLIC_MEDIA_WRITE_KEY: ${{ secrets.EXPO_PUBLIC_MEDIA_WRITE_KEY }}
        # DEPLOI-VERROU-1 (F-17) — eas-cli is the lockfile's 20.5.1 (a
        # devDependency of this app, integrity-checked), never fetched at publish
        # time beside EXPO_TOKEN.
        run: |
          pnpm exec eas init --non-interactive --force
          pnpm exec eas update:configure --non-interactive
          pnpm exec eas update --channel preview --non-interactive --auto --message "${GITHUB_REF_NAME}@${GITHUB_SHA} root=${EXPO_PUBLIC_ROOT}"

name: fournisseur-web-deploy

# READINESS-WIRE-1b-ii — deploy the FOURNISSEUR surface (fulfillment-only) to
# its own Cloudflare Pages project.
#
# FOUNDER RULING (2026-08-02, verbatim in JOURNAL): « i do not want other
# suppliers boutik+ webapp be able to list new products, only my webapp have
# that capability, their webapp will be only able to accept commandes, upload
# photo prove of readiness , and see all the follow up until product is
# delivered ». THIS WORKFLOW IS THAT RULING'S DEPLOY-TIME HALF:
#   · NO AUTHORING CREDENTIAL IS EVER IN THIS FILE. The fournisseur bundle
#     cannot inline a secret this job never receives. (Since CLE-FONDATEUR-1
#     no bundle carries one at all: authoring rides the founder's typed key.)
#   · The absence scan below runs on the EXACT dist this job deploys: the
#     offers client's route literals must be ABSENT, the fournisseur's own
#     literals PRESENT (control), or the deploy fails before wrangler runs.
#
# MANUAL ONLY (workflow_dispatch): a deploy is a deliberate act — the standing
# ruling. COLD export always (`--clear`): Metro's transform cache is not keyed
# on EXPO_PUBLIC_* values (cost a live debugging round 2026-07-26; re-measured
# 2026-08-02 while building the artifact gate).
#
# SECRETS — pre-existing only: EXPO_PUBLIC_OFFER_BASE, EXPO_PUBLIC_MEDIA_BASE,
# EXPO_PUBLIC_MEDIA_WRITE_KEY (media upload IS a granted capability: « upload
# photo prove of readiness »), CLOUDFLARE_API_TOKEN,
# PLATFORM_CONTRACTS_READ_TOKEN. Deliberately NOT: the offers write key.

on:
  workflow_dispatch:

# `actions: read` is for the first step alone: it asks whether ci passed on
# this exact commit (DEPLOI-VERROU-1).
permissions:
  contents: read
  actions: read

concurrency:
  group: fournisseur-web-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # DEPLOI-VERROU-1 (AUDIT-B+2 F-17) — every action pinned to a commit SHA,
      # the tag it resolves from kept beside it; `wrangler` is the lockfile's
      # 4.130.0, never a floating `npx --yes wrangler@4` (see offer-deploy.yml).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # DEPLOI-VERROU-1 (F-84) — only main's newest commit, green in ci, goes
      # live. The reasons are in the script's header.
      - name: Only main's newest commit, green in ci, can go live
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/deploy-only-main.sh
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0 (what the moving v4 resolves to)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      # DEPLOI-VERROU-1 (F-17) — the scoped platform-contracts grant, as in
      # ci.yml: only this step reads it, and it is deleted when the install ends.
      - name: Install (frozen lockfile) with a scoped platform-contracts grant, discarded after
        env:
          GIT_CONFIG_GLOBAL: ${{ runner.temp }}/platform-contracts.gitconfig
          PLATFORM_CONTRACTS_READ_TOKEN: ${{ secrets.PLATFORM_CONTRACTS_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${PLATFORM_CONTRACTS_READ_TOKEN}" ]; then
            B="https://x-access-token:${PLATFORM_CONTRACTS_READ_TOKEN}@github.com/beurni2/platform-contracts"
            git config --global url."$B".insteadOf "https://github.com/beurni2/platform-contracts"
            git config --global --add url."$B".insteadOf "git@github.com:beurni2/platform-contracts"
            git config --global --add url."$B".insteadOf "ssh://git@github.com/beurni2/platform-contracts"
          fi
          trap 'rm -f "$GIT_CONFIG_GLOBAL"' EXIT
          pnpm install --frozen-lockfile
      - name: Export the fournisseur web bundle (COLD — see header; NO offers write key in env)
        working-directory: apps/supplier-app
        env:
          EXPO_PUBLIC_ROOT: fournisseur
          EXPO_PUBLIC_OFFER_BASE: ${{ secrets.EXPO_PUBLIC_OFFER_BASE }}
          EXPO_PUBLIC_MEDIA_BASE: ${{ secrets.EXPO_PUBLIC_MEDIA_BASE }}
          EXPO_PUBLIC_MEDIA_WRITE_KEY: ${{ secrets.EXPO_PUBLIC_MEDIA_WRITE_KEY }}
        run: pnpm exec expo export --platform web --clear --output-dir dist-fournisseur
      - name: Assert the capability ruling ON THE EXACT DIST THIS JOB DEPLOYS
        working-directory: apps/supplier-app
        env:
          OFFER_BASE: ${{ secrets.EXPO_PUBLIC_OFFER_BASE }}
          MEDIA_BASE: ${{ secrets.EXPO_PUBLIC_MEDIA_BASE }}
          MEDIA_KEY: ${{ secrets.EXPO_PUBLIC_MEDIA_WRITE_KEY }}
        run: |
          # Empty-secret guard first (the W5 blind spot: grep -F "" matches everything).
          for v in OFFER_BASE MEDIA_BASE MEDIA_KEY; do
            if [ -z "${!v}" ]; then
              echo "::error::the secret behind $v is unset — a fournisseur app without it ships a photo flow that can never work"
              exit 1
            fi
          done
          # CONTROLS — the scan must SEE the fournisseur's own literals.
          # "/offers/mine" is REQUIRED since LISTER-POUR-1c: it is the one
          # granted offers read, and requiring it keeps the excusal below from
          # outliving the code it excuses (same three-part discipline as
          # scripts/gates/fournisseur-bundle-absence.mjs — the OTHER copy of
          # this law; when one changes, change both. This deploy refused a
          # good bundle on 2026-08-02 precisely because only the gate copy
          # had been evolved).
          for want in "boutik.fournisseur.code" "/fulfillment/mine" "/fulfillment/ramassage/verify" "/offers/mine"; do
            if ! grep -rqF "$want" dist-fournisseur/_expo/static/js/web/; then
              echo "::error::control $want not found — the scan cannot see, refusing to deploy"
              exit 1
            fi
          done
          for v in OFFER_BASE MEDIA_BASE; do
            if ! grep -rqF "${!v}" dist-fournisseur/_expo/static/js/web/; then
              echo "::error::the value behind $v did not inline — the export would ship a broken app"
              exit 1
            fi
          done
          # THE RULING — the offers client's routes must be ABSENT.
          for banned in "/offers/assets" "/offers/delete" "/media/revoke" "revokeImage"; do
            if grep -rqF "$banned" dist-fournisseur/_expo/static/js/web/; then
              echo "::error::$banned FOUND in the fournisseur artifact — the authoring client rode in; do not deploy"
              exit 1
            fi
          done
          # Bare "/offers" — with the GRANTED read masked first (LISTER-POUR-1c,
          # founder-ordered): "/offers/mine" legitimately rides this bundle, and
          # every write route above is scanned UNMASKED so the mask can hide
          # nothing but the read itself.
          echo "excusal: /offers/mine is a GRANTED read (LISTER-POUR-1c) — masked before the bare /offers scan"
          if find dist-fournisseur/_expo/static/js/web/ -type f -print0 | xargs -0 cat | sed 's|/offers/mine||g' | grep -qF "/offers"; then
            echo "::error::/offers FOUND (beyond the granted /offers/mine) — the authoring client rode in; do not deploy"
            exit 1
          fi
          echo "capability ruling holds on the deployed artifact: authoring client absent, fournisseur literals present"
          # CLE-FONDATEUR-1 (F-86) — the page's protective headers ride the
          # export (public/_headers); a deploy without them is refused.
          if ! grep -qF "X-Frame-Options: DENY" dist-fournisseur/_headers; then
            echo "::error::dist-fournisseur/_headers is missing or has no X-Frame-Options — public/_headers did not reach the export"
            exit 1
          fi
      # DEMO-TRACE-1 + POIDS-WEB-1 + COQUILLE-WEB-1 (AUDIT-B+2 F-85, F-88) — on
      # the exact dist this job uploads: nothing that must never ship (the demo
      # supply adapter's sentinel, the retired E1 root's demo data), the
      # first-load size printed (enforced once a ceiling is signed), and the
      # offline shell written into it as sw.js.
      - name: What never ships, the size, and the offline shell — on the exact dist this job deploys
        run: node scripts/gates/web-artifact-checks.mjs apps/supplier-app/dist-fournisseur fournisseur
      - name: Ensure the Pages project exists (idempotent — create errors if present)
        working-directory: apps/supplier-app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        # The lockfile's wrangler is a devDependency of offer-service; it is
        # called by path so the step still runs from this app's folder (from
        # offer-service it would read that Worker's wrangler.toml and warn).
        run: |
          "$GITHUB_WORKSPACE/services/offer-service/node_modules/.bin/wrangler" pages project create boutik-plus-fournisseur --production-branch=main || true
      - name: Deploy to Cloudflare Pages
        working-directory: apps/supplier-app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          "$GITHUB_WORKSPACE/services/offer-service/node_modules/.bin/wrangler" pages deploy dist-fournisseur --project-name boutik-plus-fournisseur --branch=main --commit-hash="${{ github.sha }}"

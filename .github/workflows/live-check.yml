# LIVE-CHECK — a read-only smoke check of the LIVE offer + media services,
# runnable on demand when the founder wants his live state double-checked
# (first use: 2026-07-27, "i also did some deletions and you can double check
# it").
#
# PUBLIC-LOG DISCIPLINE (this repo is public, so these logs are public): the
# job prints COUNTS only — never raw service JSON, never an id or a piece of
# one, never a media ref (a ref is the read authorization), a rayon, a stock
# figure or a hidden reason. scripts/gates/live-check-log-proof.mjs runs this
# step's own text against a stand-in and fails the board if any of it leaks.
# THE KEY (CLE-FONDATEUR-1, 2026-09-26): this read used to ride the shared
# write key baked into the console page. That key is RETIRED — the live
# service refuses it — and the list now opens only to the founder's operator
# key. Whether that key may live in this repo's Actions secrets is HIS call,
# not a default: until he sets LIVE_CHECK_OPS_KEY the job stops at once and
# says so, instead of failing on a 401 that reads like an outage.
# WHAT IT CANNOT CHECK, stated so silence is never mistaken for coverage: the
# Bearer-gated supply projections (SUPPLY_READ_SECRET is a worker secret, not
# a repo secret). The admin list reads the same index the collection
# enumerates, so a product absent here is absent from Shop+'s discovery too;
# only the per-pv pointer wire goes unverified by this check.
name: live-check
on:
  workflow_dispatch: {}

# DEPLOI-VERROU-1 (AUDIT-B+2 F-17) — this job reads the live services with its
# own secrets and never touches the repository: its token gets nothing.
permissions: {}

jobs:
  live-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read the live supplier list and probe each photo
        env:
          OFFER_BASE: ${{ secrets.EXPO_PUBLIC_OFFER_BASE }}
          OPS_KEY: ${{ secrets.LIVE_CHECK_OPS_KEY }}
          MEDIA_BASE: ${{ secrets.EXPO_PUBLIC_MEDIA_BASE }}
        run: |
          set -euo pipefail
          for v in OFFER_BASE MEDIA_BASE; do
            if [ -z "${!v}" ]; then echo "::error::secret $v is empty"; exit 1; fi
          done
          if [ -z "$OPS_KEY" ]; then
            echo "::error::live-check needs the founder's operator key (repo secret LIVE_CHECK_OPS_KEY), and storing it in Actions is his decision. Until then, read the live list from the console's Produits tab."
            exit 1
          fi
          body=$(curl -sS --fail-with-body -H "Authorization: Bearer $OPS_KEY" \
            "${OFFER_BASE%/}/offers?supplierId=supplier-founder-001")
          # Counts only: ids, rayons, stock figures, hidden reasons and media
          # refs stay out of this public log, even shortened.
          echo "LIVE PRODUCTS: $(jq '.items | length' <<<"$body")"
          echo "hidden from Shop+: $(jq '[.items[] | select(.hiddenReason)] | length' <<<"$body")"
          echo "with a clip: $(jq '[.items[] | select(.videoRef)] | length' <<<"$body")"
          echo "without a rayon: $(jq '[.items[] | select((.category // "") == "")] | length' <<<"$body")"
          echo "photos: $(jq '[.items[].assetRefs[]] | length' <<<"$body")"
          codes=""
          for ref in $(jq -r '.items[].assetRefs[]' <<<"$body"); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' "${MEDIA_BASE%/}/$ref" 2>/dev/null || echo "ERR")
            codes+="$code"$'\n'
          done
          printf '%s' "$codes" | sort | uniq -c | while read -r n c; do echo "photos answering HTTP $c: $n"; done
          echo "---- verdict ----"
          echo "The counts above are what the live service still holds for the founder's supplier id."
          echo "A deleted product is simply not counted; every photo of a kept product should answer HTTP 200."
          echo "To see which product is which, open the console's Produits tab."

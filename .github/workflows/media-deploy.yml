name: media-deploy

# SERVICE-PROVENANCE-1 — deploy the media Worker (the `GET /media/{token}` read
# route over the PRIVATE R2 bucket). Mirrors offer-deploy.yml; media-service was
# merged with a wrangler config but NO workflow, so it was undeployable through CI.
#
# MANUAL ONLY (workflow_dispatch): a deploy is a deliberate act. Gated on the
# CLOUDFLARE_API_TOKEN repo secret.
#
# UNPROVEN UNTIL THIS ACTUALLY RUNS — media-service has NEVER been deployed, so
# nothing below is validated by any local run or by green CI: the R2 binding and
# the bucket name in wrangler.toml, whether the bucket exists on the account, and
# the first-deploy behaviour generally. Miniflare binds R2 by its OWN test config,
# never this file. (There is no Durable Object here, so unlike offer-service there
# is no [[migrations]] block to get wrong — the one first-deploy hazard that does
# NOT apply to this service.)
#
# SECRETS (correction 2026-08-02 — this header once said "no write route yet",
# true when written, long since false): the Worker now gates TWO capabilities
# behind TWO wrangler secrets, both set with `wrangler secret put` (value
# PIPED, never an argument) — NEVER the dashboard, never [vars] (public repo):
#   · MEDIA_WRITE_SECRET  — uploads (POST /media); its value also lives in the
#     app bundles as EXPO_PUBLIC_MEDIA_WRITE_KEY.
#   · MEDIA_REVOKE_SECRET — MEDIA-KEY-SPLIT (2026-08-02): destruction
#     (POST /media/revoke) answers ONLY to this one. Since CLE-FONDATEUR-1 its
#     value rides NO bundle: the founder types it once in his console
#     (Opérations › Fournisseurs › « Clé des photos »). Unset ⇒ every revoke
#     401s — fail-closed, not broken — and the console counts the photos that
#     did not go, with a retry.

on:
  workflow_dispatch:

# `actions: read` is for the first step alone: it asks whether ci passed on
# this exact commit (DEPLOI-VERROU-1).
permissions:
  contents: read
  actions: read

concurrency:
  group: media-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # DEPLOI-VERROU-1 (AUDIT-B+2 F-17) — every action pinned to a commit SHA,
      # the tag it resolves from kept beside it; `wrangler` is the lockfile's
      # 4.130.0, never a floating `npx --yes wrangler@4` (see offer-deploy.yml).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # DEPLOI-VERROU-1 (F-84) — only main's newest commit, green in ci, goes
      # live. The reasons are in the script's header.
      - name: Only main's newest commit, green in ci, can go live
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/deploy-only-main.sh
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0 (what the moving v4 resolves to)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      # DEPLOI-VERROU-1 (F-17) — the scoped platform-contracts grant, as in
      # ci.yml: only this step reads it, and it is deleted when the install ends.
      - name: Install (frozen lockfile) with a scoped platform-contracts grant, discarded after
        env:
          GIT_CONFIG_GLOBAL: ${{ runner.temp }}/platform-contracts.gitconfig
          PLATFORM_CONTRACTS_READ_TOKEN: ${{ secrets.PLATFORM_CONTRACTS_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${PLATFORM_CONTRACTS_READ_TOKEN}" ]; then
            B="https://x-access-token:${PLATFORM_CONTRACTS_READ_TOKEN}@github.com/beurni2/platform-contracts"
            git config --global url."$B".insteadOf "https://github.com/beurni2/platform-contracts"
            git config --global --add url."$B".insteadOf "git@github.com:beurni2/platform-contracts"
            git config --global --add url."$B".insteadOf "ssh://git@github.com/beurni2/platform-contracts"
          fi
          trap 'rm -f "$GIT_CONFIG_GLOBAL"' EXIT
          pnpm install --frozen-lockfile
      # Compile the workspace packages FIRST — the trap that killed shop-plus's
      # first deploy: the bundle inlines @boutik/observability, whose package.json
      # `exports` resolves to dist/index.js, which only exists after a build.
      # Without this the deploy dies at the bundle step, before reaching Cloudflare.
      - run: pnpm build
      # SERVICE-PROVENANCE-1 — same stamp as offer-deploy, so BOTH services answer
      # which build they are and which wire shape they speak in one curl. `canon`
      # is read from the INSTALLED package, never hand-typed, so it cannot drift
      # from what was actually bundled.
      - name: Resolve the provenance stamp
        run: |
          echo "BOUTIK_RELEASE=${{ github.sha }}" >> "$GITHUB_ENV"
          echo "BOUTIK_CANON=$(node -p "require('./node_modules/@platform/contracts/package.json').version")" >> "$GITHUB_ENV"
      - name: Bundle the media Worker (read route)
        run: pnpm --filter @boutik/media-service bundle:worker
      - name: Deploy to Cloudflare Workers
        working-directory: services/media-service
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm exec wrangler deploy

      # ═══ AUDIT-B+1 F9 — THE ASSERTION offer-deploy HAS AND THIS ONE DID NOT ═══
      #
      # This workflow ended at `wrangler deploy`, which proves the UPLOAD was
      # accepted — not that the running Worker is this bundle. offer-deploy grew
      # the check below after a stale-branch deploy took the supplier web app
      # down for ~40 minutes with nothing noticing (its comment, :108-118).
      # media-service computes the SAME provenance stamp two steps up and never
      # checked it, and it already serves /health through the shared
      # makeHealthFetch helper, so `canon` and `release` are there to be read.
      #
      # A WORKERS DEPLOY PROPAGATES; IT DOES NOT SWITCH. Asserting instantly
      # reads whichever bundle that edge still holds, so this polls for up to
      # three minutes and fails only if the live Worker NEVER becomes this
      # build. A checker that reddens a correct deploy trains everyone to
      # ignore it.
      #
      # An EMPTY secret is a hard error, matching offer-deploy and live-check:
      # the upload has already happened and is reported above — this step's job
      # is to say whether anyone verified it, and « nobody could » deserves a
      # red mark once, not a green tick forever.
      - name: Assert the live media Worker is the bundle this job built
        env:
          MEDIA_BASE: ${{ secrets.EXPO_PUBLIC_MEDIA_BASE }}
        run: |
          set -uo pipefail
          if [ -z "${MEDIA_BASE}" ]; then
            echo "::error::EXPO_PUBLIC_MEDIA_BASE is empty — the deploy above ran, but NOTHING verified it."
            echo "Set the secret so this step can prove the live Worker is the bundle this job built."
            exit 1
          fi
          BASE="${MEDIA_BASE%/}"
          OUT=$(mktemp)
          DEADLINE=$(( $(date +%s) + 180 ))
          LIVE_CANON='?'; LIVE_RELEASE='?'
          while :; do
            CODE=$(curl -sS -o "$OUT" -w '%{http_code}' "$BASE/health" || echo 000)
            if [ "$CODE" = "200" ]; then
              LIVE_CANON=$(node -p "JSON.parse(require('fs').readFileSync('$OUT','utf8')).canon" 2>/dev/null || echo '?')
              LIVE_RELEASE=$(node -p "JSON.parse(require('fs').readFileSync('$OUT','utf8')).release" 2>/dev/null || echo '?')
              echo "health 200 — live canon=$LIVE_CANON release=$LIVE_RELEASE (want $BOUTIK_CANON / $BOUTIK_RELEASE)"
              if [ "$LIVE_CANON" = "$BOUTIK_CANON" ] && [ "$LIVE_RELEASE" = "$BOUTIK_RELEASE" ]; then
                echo "PROVENANCE OK — live media Worker is $BOUTIK_RELEASE speaking canon $BOUTIK_CANON."
                exit 0
              fi
            else
              echo "health $CODE — not answering yet"
            fi
            if [ "$(date +%s)" -ge "$DEADLINE" ]; then
              echo "::error::DEPLOY DID NOT TAKE — after 180s the live media Worker is still not this job's bundle."
              echo "  live canon=$LIVE_CANON release=$LIVE_RELEASE"
              echo "  want canon=$BOUTIK_CANON release=$BOUTIK_RELEASE"
              exit 1
            fi
            sleep 10
          done

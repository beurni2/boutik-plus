name: offer-deploy

# BOUTIK-OFFER-DURABLE-1 — deploy the combined offer Worker (the OfferDO Durable
# Object + the service routes) to Cloudflare. Mirrors shop-plus's deploy workflow.
#
# MANUAL ONLY (workflow_dispatch): a deploy is a deliberate act. The FIRST run
# also applies the DO migration (creating OfferDO). Gated on the
# CLOUDFLARE_API_TOKEN repo secret.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offer-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Authorize read access to platform-contracts (CI-only)
        run: git config --global url."https://x-access-token:${{ secrets.PLATFORM_CONTRACTS_READ_TOKEN }}@github.com/beurni2/platform-contracts".insteadOf "https://github.com/beurni2/platform-contracts"
      # Guard against pnpm re-mangling lockfile git-dep URLs to SSH forms (see ci.yml).
      - name: Authorize read access to platform-contracts (CI-only, SSH forms)
        run: |
          git config --global --add url."https://x-access-token:${{ secrets.PLATFORM_CONTRACTS_READ_TOKEN }}@github.com/beurni2/platform-contracts".insteadOf "git@github.com:beurni2/platform-contracts"
          git config --global --add url."https://x-access-token:${{ secrets.PLATFORM_CONTRACTS_READ_TOKEN }}@github.com/beurni2/platform-contracts".insteadOf "ssh://git@github.com/beurni2/platform-contracts"
      - run: pnpm install --frozen-lockfile
      # Compile the workspace packages FIRST (the trap shop-plus's first deploy hit):
      # the combined bundle inlines @boutik/observability, whose package.json
      # `exports` resolves to dist/index.js — which only exists after a build.
      # Without this step esbuild cannot resolve it and the deploy dies at the
      # bundle step, before ever reaching Cloudflare.
      - run: pnpm build
      # SERVICE-PROVENANCE-1 — stamp the bundle so the deployed artifact can say
      # WHICH BUILD it is (release) and WHICH WIRE SHAPE it speaks (canon). The
      # second is the one that matters: a sha alone would not have revealed that
      # the live Worker was still emitting the five-field projection. Read canon
      # from the INSTALLED package, never from a hand-typed constant, so it cannot
      # drift from what was actually bundled.
      - name: Resolve the provenance stamp
        run: |
          echo "BOUTIK_RELEASE=${{ github.sha }}" >> "$GITHUB_ENV"
          echo "BOUTIK_CANON=$(node -p "require('./node_modules/@platform/contracts/package.json').version")" >> "$GITHUB_ENV"
      - name: Bundle the combined Worker (OfferDO + service routes)
        run: pnpm --filter @boutik/offer-service bundle:worker
      # ═══ THE SÉRA WIRE, ARMED WITH THE DEPLOY (SE-LIVE-2) ═══
      #
      # `fulfillment-do.ts` delivers the readiness fact to Séra's intake door and
      # reads BOTH of these from the Worker env. Until this step existed the
      # workflow shipped the code and nothing else: the outbox had nowhere to
      # deliver, so the wire was live in the repo and dead in production.
      #
      # THE BASE IS A `--var`, NOT A SECRET — it is a public Worker URL and
      # knowing it grants nothing; the door refuses without the key. The KEY is
      # piped to `wrangler secret put`, never an argument, so it stays out of any
      # process listing (this repo is PUBLIC).
      #
      # UNSET IS A LEGITIMATE STATE — the deploy-order law's normal case: Boutik+
      # may ship before Séra's door exists. Unwired, the outbox holds the fact and
      # retries; it never drops it and never reports delivered. So this WARNS and
      # does NOT fail the deploy.
      - name: Deploy to Cloudflare Workers
        id: deploy
        working-directory: services/offer-service
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SERA_INTAKE_BASE: ${{ vars.SERA_INTAKE_BASE }}
        run: |
          set -euo pipefail
          if [ -n "${SERA_INTAKE_BASE}" ]; then
            npx --yes wrangler@4 deploy --var SERA_INTAKE_BASE:"${SERA_INTAKE_BASE}"
          else
            echo "::warning title=Fil Sera NON armé::SERA_INTAKE_BASE is not set — the readiness fact has nowhere to go. The outbox keeps it and retries; nothing is dropped and nothing reports delivered."
            npx --yes wrangler@4 deploy
          fi

      - name: Arm the Séra intake key (piped — warns only if the repo secret is absent)
        working-directory: services/offer-service
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SERA_INTAKE_SECRET: ${{ secrets.SERA_INTAKE_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${SERA_INTAKE_SECRET}" ]; then
            echo "::warning title=Cle Sera NON armee::SERA_INTAKE_SECRET absent — Séra's door will refuse every delivery (fail-closed) until the repo secret is set and this workflow re-dispatched."
            exit 0
          fi
          printf '%s' "${SERA_INTAKE_SECRET}" | npx --yes wrangler@4 secret put SERA_INTAKE_SECRET

      # ═══ THE FOUNDER'S ATTESTATION, WRITTEN WITH THE DEPLOY ═══
      #
      # SELLER-TIER-WIRE-1. `VERIFIED_SUPPLIERS` is the list of supplier ids the
      # founder has personally vouched for; `attested-suppliers.ts` turns it into
      # the `sellerTier` on the supply wire, and Shop+'s §6.1 decides pay-at-door
      # from it. It rides WITH the deploy on the founder's instruction, so the
      # code that reads it and the value it reads can never arrive separately.
      #
      # A SECRET, NOT `[vars]`, AND THE REASON IS IN wrangler.toml: « all five
      # repos are PUBLIC and anything in [vars] is committed and published ».
      # This list is not a credential — knowing it grants nothing, because the
      # tier is resolved from the supplier id the STORE holds and never from
      # anything a caller sends — but it is a record of which real businesses the
      # founder has vouched for, and that does not belong in a public repository.
      # The encrypted store keeps it out while `wrangler secret put` still writes
      # it deliberately, from a value only the founder can set.
      #
      # UNSET IS A LEGITIMATE STATE, unlike the webhook secret this pattern is
      # borrowed from. No attestation simply means no supplier is verified, which
      # means §6.1 refuses Option B for every product — the designed fail-closed
      # behaviour while ⏳ « verification tiers evidence + progression thresholds »
      # stays open. So this WARNS loudly and does NOT fail the deploy: a red mark
      # here would be a checker reddening a correct deploy.
      #
      # Piped, never passed as an argument, so it stays out of any process
      # listing — the same discipline as shop-plus's payment-webhook-secret.
      - name: Write the founder's supplier attestations onto the Worker
        working-directory: services/offer-service
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          VERIFIED_SUPPLIERS: ${{ secrets.VERIFIED_SUPPLIERS }}
        run: |
          set -euo pipefail
          if [ -z "${VERIFIED_SUPPLIERS}" ]; then
            echo "::warning::VERIFIED_SUPPLIERS is not set — NO supplier is attested."
            echo "The deploy is valid and the service is fail-closed: every projection will"
            echo "carry sellerTier=provisional, so Shop+'s §6.1 refuses Option B for every"
            echo "product. Set the repository secret and re-run this workflow to change that."
            exit 0
          fi
          # The COUNT is safe to print and useful; the ids are not printed.
          echo "attesting $(echo "${VERIFIED_SUPPLIERS}" | tr ', ' '\n' | grep -c . || true) supplier id(s)"
          printf '%s' "${VERIFIED_SUPPLIERS}" | npx --yes wrangler@4 secret put VERIFIED_SUPPLIERS
          echo "attestations written to the Worker's encrypted store."

      # ═══ THE HALF THAT WAS MISSING, AND IT COST A PRODUCTION OUTAGE ═══
      #
      # Until now this workflow ended at `wrangler deploy`. That proves the
      # UPLOAD was accepted — not that the running Worker is this bundle, and
      # not that this bundle is what anyone intended. On 2026-08-01 a deploy
      # from a stale feature branch rolled the CORS block out of the live
      # service (breaking the supplier web app for ~40 min), and NOTHING here
      # noticed; the corrective deploy could not be confirmed either, for the
      # same reason. shop-plus has had this assertion for a while. boutik is
      # the PRODUCER on a wire whose whole safety property is ordering, so it
      # is the worse one to leave unproven.
      #
      # A WORKERS DEPLOY PROPAGATES; IT DOES NOT SWITCH — the lesson
      # storefront-deploy.yml already paid for. Asserting instantly reads
      # whichever bundle that edge still holds, so this polls for up to three
      # minutes and fails only if the live Worker NEVER becomes this build. A
      # checker that reddens a correct deploy trains everyone to ignore it.
      #
      # An EMPTY secret is a hard error here, matching live-check.yml. That is
      # not "failing a correct deploy": the upload has already happened and is
      # reported above — this step's job is to say whether anyone verified it,
      # and « nobody could » is a real answer that deserves a red mark once,
      # not a green tick forever.
      - name: Assert the live Worker is the bundle this job built
        env:
          OFFER_BASE: ${{ secrets.EXPO_PUBLIC_OFFER_BASE }}
        run: |
          set -uo pipefail
          if [ -z "${OFFER_BASE}" ]; then
            echo "::error::EXPO_PUBLIC_OFFER_BASE is empty — the deploy above ran, but NOTHING verified it."
            echo "Set the secret so this step can prove the live Worker is the bundle this job built."
            exit 1
          fi
          BASE="${OFFER_BASE%/}"
          OUT=$(mktemp)
          DEADLINE=$(( $(date +%s) + 180 ))
          LIVE_CANON='?'; LIVE_RELEASE='?'
          while :; do
            CODE=$(curl -sS -o "$OUT" -w '%{http_code}' "$BASE/health" || echo 000)
            if [ "$CODE" = "200" ]; then
              LIVE_CANON=$(node -p "JSON.parse(require('fs').readFileSync('$OUT','utf8')).canon" 2>/dev/null || echo '?')
              LIVE_RELEASE=$(node -p "JSON.parse(require('fs').readFileSync('$OUT','utf8')).release" 2>/dev/null || echo '?')
              echo "health 200 — live canon=$LIVE_CANON release=$LIVE_RELEASE (want $BOUTIK_CANON / $BOUTIK_RELEASE)"
              if [ "$LIVE_CANON" = "$BOUTIK_CANON" ] && [ "$LIVE_RELEASE" = "$BOUTIK_RELEASE" ]; then
                echo "PROVENANCE OK — live Worker is $BOUTIK_RELEASE speaking canon $BOUTIK_CANON."
                exit 0
              fi
            else
              echo "health $CODE — not answering yet"
            fi
            if [ "$(date +%s)" -ge "$DEADLINE" ]; then
              echo "::error::DEPLOY DID NOT TAKE — after 180s the live Worker is still not this job's bundle."
              echo "  live canon=$LIVE_CANON release=$LIVE_RELEASE"
              echo "  want canon=$BOUTIK_CANON release=$BOUTIK_RELEASE"
              exit 1
            fi
            sleep 10
          done

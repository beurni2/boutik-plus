name: web-deploy

# BOUTIK-WEB-W5 — deploy the Boutik+ supplier WEB APP to Cloudflare Pages
# (W-D3 founder ruling 2026-07-26: « yes use your recommendation »).
#
# MANUAL ONLY (workflow_dispatch): a deploy is a deliberate act — the same
# standing ruling that governs offer-deploy and media-deploy. Nothing here
# fires on push.
#
# THE EXPORT RUNS COLD, ALWAYS (`--clear`): Metro caches the babel transform
# that inlines EXPO_PUBLIC_* values, and a warm export can ship STALE service
# URLs or keys silently (this cost a live debugging round on 2026-07-26,
# journaled). A CI runner is cold by nature; the flag makes the law explicit
# rather than incidental.
#
# SECRETS — all pre-existing, none new:
#   · EXPO_PUBLIC_OFFER_BASE / _OFFER_WRITE_KEY / _MEDIA_BASE / _MEDIA_WRITE_KEY
#     — the same four expo-preview.yml already inlines for the native preview.
#     They bake into the PUBLIC js bundle; the standing key-exposure model
#     applies unchanged (documented in service-auth: the shared key "stops
#     scanners, not attackers"; the HARD GATE — no supplier but the founder
#     authors until per-supplier identity — binds harder once hosted).
#   · CLOUDFLARE_API_TOKEN — the worker-deploy token. If it was scoped to
#     Workers only, the FIRST run fails at the Pages step with a permission
#     error: extend the token with Pages:Edit in the Cloudflare dashboard and
#     re-dispatch. Named here so that failure reads as configuration, not code.
#
# THE DEPLOYED SERVICES MUST SPEAK CORS FIRST: a hosted page can only talk to
# offer/media workers deployed at or after the W1/W4 CORS layers. Dispatch
# offer-deploy and media-deploy before (or with) the first web-deploy.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Authorize read access to platform-contracts (CI-only)
        run: git config --global url."https://x-access-token:${{ secrets.PLATFORM_CONTRACTS_READ_TOKEN }}@github.com/beurni2/platform-contracts".insteadOf "https://github.com/beurni2/platform-contracts"
      # Guard against pnpm re-mangling lockfile git-dep URLs to SSH forms (see ci.yml).
      - name: Authorize read access to platform-contracts (CI-only, SSH forms)
        run: |
          git config --global --add url."https://x-access-token:${{ secrets.PLATFORM_CONTRACTS_READ_TOKEN }}@github.com/beurni2/platform-contracts".insteadOf "git@github.com:beurni2/platform-contracts"
          git config --global --add url."https://x-access-token:${{ secrets.PLATFORM_CONTRACTS_READ_TOKEN }}@github.com/beurni2/platform-contracts".insteadOf "ssh://git@github.com/beurni2/platform-contracts"
      - run: pnpm install --frozen-lockfile
      - name: Export the web bundle (COLD — see header)
        working-directory: apps/supplier-app
        env:
          EXPO_PUBLIC_ROOT: v2
          EXPO_PUBLIC_OFFER_BASE: ${{ secrets.EXPO_PUBLIC_OFFER_BASE }}
          EXPO_PUBLIC_OFFER_WRITE_KEY: ${{ secrets.EXPO_PUBLIC_OFFER_WRITE_KEY }}
          EXPO_PUBLIC_MEDIA_BASE: ${{ secrets.EXPO_PUBLIC_MEDIA_BASE }}
          EXPO_PUBLIC_MEDIA_WRITE_KEY: ${{ secrets.EXPO_PUBLIC_MEDIA_WRITE_KEY }}
          # MEDIA-KEY-SPLIT — the founder-only revoke credential (the value of
          # media-service's MEDIA_REVOKE_SECRET). ONLY this workflow may carry
          # it: fournisseur-web-deploy.yml must NEVER receive it — in a
          # supplier bundle it would be a delete credential for the founder's
          # product photographs, the exact hole the split closes.
          EXPO_PUBLIC_MEDIA_REVOKE_KEY: ${{ secrets.EXPO_PUBLIC_MEDIA_REVOKE_KEY }}
          # BC-1c — the Shop+ storefront Worker's URL (config, not a
          # credential), for the console's Livraisons section. The KEY that
          # opens that read (CHECKOUT_OPS_SECRET, value C) is NEVER here —
          # typed by the founder at the section's own door, like the board's.
          EXPO_PUBLIC_SHOP_CHECKOUT_BASE: ${{ secrets.EXPO_PUBLIC_SHOP_CHECKOUT_BASE }}
          # FONDS-CONSOLE-B+ — the protection-service Worker's URL (config,
          # not a credential), for the console's Fonds zone. The KEY that
          # opens the fund book (PROTECTION_OPS_SECRET) is NEVER here — the
          # founder's alone, typed at the zone's own door, third of the three.
          EXPO_PUBLIC_PROTECTION_BASE: ${{ secrets.EXPO_PUBLIC_PROTECTION_BASE }}
          # SE-LIVE-4e-B+ — the « Coursiers » zone reads the Séra rider registry.
          # CONFIG, NOT A CREDENTIAL: a public workers.dev URL, the same one
          # /health answers on. The KEY (SERA_OPS_SECRET) is typed by the founder
          # and must NEVER appear here — it opens the rider registry and the SOS
          # board for every rider, and this repo is public.
          EXPO_PUBLIC_SERA_LOGISTICS_BASE: ${{ secrets.EXPO_PUBLIC_SERA_LOGISTICS_BASE }}
        run: npx expo export --platform web --clear --output-dir dist-web
      - name: Verify the bundle carries the service base (a cold-export sentinel)
        working-directory: apps/supplier-app
        env:
          OFFER_BASE: ${{ secrets.EXPO_PUBLIC_OFFER_BASE }}
          OFFER_KEY: ${{ secrets.EXPO_PUBLIC_OFFER_WRITE_KEY }}
          MEDIA_BASE: ${{ secrets.EXPO_PUBLIC_MEDIA_BASE }}
          MEDIA_KEY: ${{ secrets.EXPO_PUBLIC_MEDIA_WRITE_KEY }}
          # env-indirected like its four siblings (verifier: a secret value
          # interpolated straight into bash can BREAK the script — the exact
          # accident this warning-only step must never cause)
          REVOKE_KEY: ${{ secrets.EXPO_PUBLIC_MEDIA_REVOKE_KEY }}
        run: |
          # AN EMPTY SECRET IS THE SENTINEL'S OWN BLIND SPOT (W5 verifier,
          # demonstrated): grep -F "" matches everything, so an unset secret
          # would GREEN this gate while the app ships « non configuré » — the
          # exact outcome the gate exists to stop. Guard all four first.
          for v in OFFER_BASE OFFER_KEY MEDIA_BASE MEDIA_KEY; do
            if [ -z "${!v}" ]; then
              echo "::error::the secret behind $v is unset or empty — fix the repo secret before deploying"
              exit 1
            fi
          done
          # MEDIA-KEY-SPLIT — WARNING ONLY, deliberately not a hard guard: the
          # console's core function never depends on the revoke key, and the
          # Worker fails closed regardless (no MEDIA_REVOKE_SECRET ⇒ every
          # revoke 401s). This line just tells the founder WHY photo cleanup
          # refuses, instead of letting it look like a bug.
          if [ -z "$REVOKE_KEY" ]; then
            echo "::warning::EXPO_PUBLIC_MEDIA_REVOKE_KEY is unset — photo revoke will answer 401 until it and media-service's MEDIA_REVOKE_SECRET are both set"
          fi
          if ! grep -rqF "$OFFER_BASE" dist-web/_expo/static/js/web/; then
            echo "::error::EXPO_PUBLIC_OFFER_BASE did not inline into the bundle — the export would ship a « non configuré » app"
            exit 1
          fi
      - name: Ensure the Pages project exists (idempotent — create errors if present)
        working-directory: apps/supplier-app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4 pages project create boutik-plus-web --production-branch=main || true
      - name: Deploy to Cloudflare Pages
        working-directory: apps/supplier-app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4 pages deploy dist-web --project-name boutik-plus-web --branch=main --commit-hash="${{ github.sha }}"

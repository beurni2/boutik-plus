name: fixture
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Only main's newest commit, green in ci, can go live
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/deploy-only-main.sh
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm exec wrangler deploy

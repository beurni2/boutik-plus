packages:
  - "apps/*"
  - "services/*"
  - "packages/*"

# pnpm 10 blocks dependency build scripts by default; the prepare builds
# need this allowlist or the packages install without dist/ (CONSUMING.md).
onlyBuiltDependencies:
  - "@platform/contracts"
  - "@platform/kernel-types"
  - "@platform/i18n"
  - "@platform/ui-tokens"
  - "@platform/certification"

# @platform/contracts depends on @platform/kernel-types by VERSION, which
# exists on no registry; this override routes that transitive resolution to
# the same pinned git ref (CONSUMING.md). THE SINGLE SOURCE OF TRUTH for the
# @platform/* pins — pnpm 10 reads overrides here, and a stale entry silently
# wins over package.json on a non-frozen resolve (WO-READ-MODEL-KIT lesson).
#
# WO-READ-MODEL-KIT (founder order 2026-07-18): @platform/contracts +
# @platform/kernel-types first re-pinned to canon v1.2.0 (sha d7b27bb) — the
# shared read-model kit (makeReadModelSchema) offer-service consumes.
#
# SUPPLY-DISPLAY-PRODUCER-1 (founder order 2026-07-24): re-pinned to canon
# v2.0.0 (sha 642f849) — the supply wire now carries productName + assetRefs
# (both REQUIRED; new AssetRefSchema; BREAKING). contracts@2.0.0 HARD-DEPS
# kernel-types@2.0.0, so the pair MOVES TOGETHER (matching platform + the
# shop-plus consumer migration). @platform/ui-tokens has no such dep and stays
# on its own pin, a832df0 (canon v1.0.1 — the FCFA money suffix wave); NOT moved
# by this order. @platform/i18n stayed f23407ce THEN; it has since moved on its
# own wave — see the F12 note at the end of this file.
# @platform/certification (devDep) additionally depends on @platform/contracts
# and @platform/ui-tokens by VERSION — also registry-absent, routed the same way;
# it is pinned in package.json (its SupplyProjection payload is what
# src/projection.ts derives the wire type from).
#
# CATEGORY-WIRE-1 (founder order 2026-08-01): re-pinned to canon v3.0.0
# (sha 767e6d0) — `SupplyProjection` now carries `category`, REQUIRED, so Shop+
# can pick the §6.2 at-door inspection row and stop reading a category off the
# buyer's own request (§6.1). BREAKING, hence MAJOR. contracts + kernel-types
# MOVE TOGETHER as always (the hard version dep), and @platform/certification
# moves with them in package.json.
#
# THIS FILE IS WHY THE FIRST ATTEMPT LOOKED LIKE IT WORKED AND DID NOT. The
# package.json pins were updated, `pnpm install` reported success, and typecheck
# passed — because the wire TYPE comes from @platform/certification (which moved)
# while the RUNTIME `SupplyProjectionSchema` comes from @platform/contracts
# (which this stale override held at v2.0.0). The result was a repo whose types
# said eight fields and whose validator refused the eighth: 21 offer-service
# tests failed with « Unrecognized key: category ». The warning three lines above
# had already written this down; heed it before editing any @platform/* pin.
#
# @platform/i18n and @platform/ui-tokens were NOT moved by THAT order — nothing
# in the category wire touches copy or tokens, and each carries its own wave.
# (@platform/i18n has since had its own wave: see the F12 note below.)
#
# READINESS-RETURN-1 (founder order 2026-08-02): re-pinned to canon v3.3.0
# (sha 58e249b) — the RETURN LEG, `fulfillment.accepted.v1` +
# `fulfillment.ready.v1`, so a reseller's follow-up can continue past
# « payée ». ADDITIVE (no export removed, no existing schema changed), hence
# MINOR. contracts + kernel-types MOVE TOGETHER as always, and
# @platform/certification moves with them in package.json. i18n and ui-tokens
# are NOT moved by this order — nothing here touches copy or tokens.
overrides:
  "@platform/kernel-types": "git+https://github.com/beurni2/platform-contracts.git#95c71c33d212ec26fffe3e36b3ccc7fbc673a7c3&path:packages/kernel-types"
  "@platform/contracts": "git+https://github.com/beurni2/platform-contracts.git#95c71c33d212ec26fffe3e36b3ccc7fbc673a7c3&path:packages/contracts"
  "@platform/ui-tokens": "git+https://github.com/beurni2/platform-contracts.git#a832df0a8ed9e9fc83083826bc11c2a2e57e615a&path:packages/ui-tokens"

# AUDIT-B+1 F12 (2026-08-06) — @platform/i18n moved on its own wave to
# 199bc2ab: the copy-lint's banned-register list gained administrative-process
# terms, so « Dossier en cours d'instruction. » is finally refused.
#
# TWO THINGS THE NEXT EDITOR NEEDS:
#  1. THE PIN LIVES IN TWO PLACES PER REPO — this repo's root package.json AND
#     apps/supplier-app/package.json. Moving only the root looks like it works:
#     pnpm install reports success and the app keeps resolving the old sha. That
#     cost a verifier round; it is the same shape as the warning above.
#  2. THE PIN IS NOW GATED. gates/fixtures/negative/catalog.administrative-
#     register.json violates ONLY a token F12 added, so reverting the i18n pin
#     makes that fixture stop failing and turns the board RED. Before F12 the
#     existing negative fixture failed under both the old and new lists and so
#     discriminated nothing — a pin regression was invisible.

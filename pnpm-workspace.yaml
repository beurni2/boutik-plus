packages:
  - "apps/*"
  - "services/*"
  - "packages/*"

# pnpm 10 blocks dependency build scripts by default; the prepare builds
# need this allowlist or the packages install without dist/ (CONSUMING.md).
onlyBuiltDependencies:
  - "@platform/contracts"
  - "@platform/kernel-types"
  - "@platform/i18n"
  - "@platform/ui-tokens"
  - "@platform/certification"

# @platform/contracts depends on @platform/kernel-types@0.3.0, which exists
# on no registry; this override routes that transitive resolution to the
# same pinned git ref (CONSUMING.md). Pin = sha 9308c641 (canon v0.3.0;
# founder ruling: the release ref is the commit — the v0.3.0 tag on origin
# is mis-pointed at the v0.2.0 commit, report-only).
# @platform/certification (0.3.0, devDep) additionally depends on
# @platform/contracts@0.3.0 and @platform/ui-tokens@0.3.0 by VERSION —
# also registry-absent, so they are routed the same way (CONSUMING.md's
# overrides section is stale for 0.3.0; flagged upstream, report-only).
overrides:
  "@platform/kernel-types": "git+https://github.com/beurni2/platform-contracts.git#9308c641c368ea56d141867d667b122e10db682d&path:packages/kernel-types"
  "@platform/contracts": "git+https://github.com/beurni2/platform-contracts.git#9308c641c368ea56d141867d667b122e10db682d&path:packages/contracts"
  "@platform/ui-tokens": "git+https://github.com/beurni2/platform-contracts.git#9308c641c368ea56d141867d667b122e10db682d&path:packages/ui-tokens"

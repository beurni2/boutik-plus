packages:
  - "apps/*"
  - "services/*"
  - "packages/*"

# pnpm 10 blocks dependency build scripts by default; the prepare builds
# need this allowlist or the packages install without dist/ (CONSUMING.md).
onlyBuiltDependencies:
  - "@platform/contracts"
  - "@platform/kernel-types"
  - "@platform/i18n"
  - "@platform/ui-tokens"
  - "@platform/certification"

# @platform/contracts depends on @platform/kernel-types@0.9.6, which exists
# on no registry; this override routes that transitive resolution to the
# same pinned git ref (CONSUMING.md). Pin = sha ba6f16d (canon v0.9.6 — the
# moderation-decision-shapes pin: catalog-service adopts canon
# ModerationReasonCodeSchema + ModerationDecisionSchema, retiring its local
# A1 enum; founder ruling: the release ref is the merge commit).
# @platform/certification (0.9.6, devDep) additionally depends on
# @platform/contracts@0.9.6 and @platform/ui-tokens@0.9.6 by VERSION —
# also registry-absent, so they are routed the same way.
overrides:
  "@platform/kernel-types": "git+https://github.com/beurni2/platform-contracts.git#ba6f16d78a2a5a13ff6877237cef6d77d35d8d65&path:packages/kernel-types"
  "@platform/contracts": "git+https://github.com/beurni2/platform-contracts.git#ba6f16d78a2a5a13ff6877237cef6d77d35d8d65&path:packages/contracts"
  "@platform/ui-tokens": "git+https://github.com/beurni2/platform-contracts.git#ba6f16d78a2a5a13ff6877237cef6d77d35d8d65&path:packages/ui-tokens"

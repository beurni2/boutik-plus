packages:
  - "apps/*"
  - "services/*"
  - "packages/*"

# pnpm 10 blocks dependency build scripts by default; the prepare builds
# need this allowlist or the packages install without dist/ (CONSUMING.md).
onlyBuiltDependencies:
  - "@platform/contracts"
  - "@platform/kernel-types"
  - "@platform/i18n"
  - "@platform/ui-tokens"
  - "@platform/certification"

# @platform/contracts depends on @platform/kernel-types@0.9.5, which exists
# on no registry; this override routes that transitive resolution to the
# same pinned git ref (CONSUMING.md). Pin = sha 2153661 (canon v0.9.5 — the
# mint-rule pin: WO-6.10 adopts CommandIdSchema + mintCommandId + the
# mint-path entropy gate; founder ruling: the release ref is the commit).
# @platform/certification (0.9.5, devDep) additionally depends on
# @platform/contracts@0.9.5 and @platform/ui-tokens@0.9.5 by VERSION —
# also registry-absent, so they are routed the same way.
overrides:
  "@platform/kernel-types": "git+https://github.com/beurni2/platform-contracts.git#2153661134c7da6fc921c14fb6c7b363001e2854&path:packages/kernel-types"
  "@platform/contracts": "git+https://github.com/beurni2/platform-contracts.git#2153661134c7da6fc921c14fb6c7b363001e2854&path:packages/contracts"
  "@platform/ui-tokens": "git+https://github.com/beurni2/platform-contracts.git#2153661134c7da6fc921c14fb6c7b363001e2854&path:packages/ui-tokens"

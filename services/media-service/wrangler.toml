# BOUTIK-MEDIA-1 — the media Worker deploy config: the read route + the PRIVATE
# R2 bucket that backs it. No Durable Object here (this service holds no durable
# index — the key→product link is the offer entry's ProductAssets in offer-service).
#
# UNPROVEN UNTIL A REAL `wrangler deploy` RUNS. Miniflare binds R2 by its OWN test
# config, never this file, so the binding below is validated only by an actual
# deploy. The same is true of the edge cache: `caches.default` is a no-op in some
# local runtimes and only demonstrably caches on real Cloudflare.

name = "media-service"
main = "dist/worker/worker.mjs"
compatibility_date = "2025-07-05"

# THE PRIVATE BUCKET. Never exposed as a public custom domain and never given a
# public r2.dev URL: the ONLY path to an image is `GET /media/{token}` on this
# Worker. A public bucket would make the opaque token pointless — the object
# names would be listable at the bucket, not merely unguessable per-URL.
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "beurni-boutik-product-media"

# NO [vars] secret here — and none may ever appear (all five repos are public).
# The upload route (POST /media, MEDIA-UPLOAD-ROUTE-1) EXISTS and is gated by the
# shared-secret write gate (worker/auth.ts, MEDIA_WRITE_SECRET), set via
# `wrangler secret put` only. (This comment once said no upload route existed —
# stale from a pre-upload slice; corrected in W5, per the W4 verifier's note.)

# A KEY CHANGES WITH NO GAP (Execution Contract §11, « overlapping windows »).
# Each key this Worker CHECKS — MEDIA_WRITE_SECRET (the uploads) and
# MEDIA_REVOKE_SECRET (`/media/revoke`) — also accepts the same name ending in
# _NEXT while that one is set, on exactly the same doors and no other: the
# upload key's next value never opens revoke, nor the other way round. A change,
# by hand:
#   1. `wrangler secret put X_NEXT` with the new value, beside X;
#   2. move the sender to the new value;
#   3. `wrangler secret put X` with the new value;
#   4. `wrangler secret delete X_NEXT`.
# Unset or empty never matches. Step 4 is part of the change: while X_NEXT is
# set, two values open the same doors (the deploy names any X_NEXT still set).

# THE LOG. One JSON line per request, written by the Worker itself and never
# carrying a person's data or a media key (see `journalRequete` in
# worker/index.ts). Every request is kept (sampling 1), the platform's own
# per-invocation lines are off (the Worker's request line stands in for them),
# and any query string the platform records is redacted.
[observability]
enabled = true
head_sampling_rate = 1
redact_query_string = true

[observability.logs]
invocation_logs = false

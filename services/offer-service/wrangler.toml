# BOUTIK-OFFER-DURABLE-1 — the combined Worker deploy config: index.ts's service
# routes + the OfferDO Durable Object, one wrangler.toml, one URL. Mirrors
# shop-plus's combined-Worker deploy slice (no R2/media here — offers are data only).
#
# UNPROVEN UNTIL A REAL `wrangler deploy` RUNS. Miniflare binds the DO by its OWN
# test config, never this file — so the binding and especially the [[migrations]]
# block below are validated only by an actual deploy, not by any green CI. A
# malformed migration passes every test and fails only on deploy.

name = "offer-service"
# The pre-built combined bundle (esbuild, the same artifact the miniflare e2e
# runs); the deploy workflow runs `bundle:worker` before `wrangler deploy`.
main = "dist/worker/worker.mjs"
compatibility_date = "2025-07-05"

# One Durable Object binding — the offer authority, addressed by idFromName(offerId)
# (and idFromName('pv:'+productVersionId) for the read pointer) inside.
[[durable_objects.bindings]]
name = "OFFER"
class_name = "OfferDO"

# FIRST-DEPLOY MIGRATION — create the DO class. `new_sqlite_classes` is CORRECT
# AND MANDATORY, not a coin-flip: Cloudflare stopped issuing key-value-backed DO
# namespaces (changelog 2026-07-09) to any account without a pre-existing one, and
# the Workers Free plan only ever supported the SQLite backend — so `new_classes`
# would be rejected outright on this account. SQLite-backed DOs expose the SAME
# key-value storage API this DO code uses (state.storage.get/put), so no code
# change follows.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["OfferDO"]

# ORDER-PAID-WIRE-1c — the paid-order book: one singleton FulfillmentDO holding
# every order Shop+ has told this platform to prepare (first-wins on orderId).
[[durable_objects.bindings]]
name = "FULFILLMENT"
class_name = "FulfillmentDO"

# Second migration: creates FulfillmentDO on the next deploy. Same
# new_sqlite_classes reasoning as v1 (the account only supports the SQLite
# backend; the storage API this code uses is identical).
[[migrations]]
tag = "v2"
new_sqlite_classes = ["FulfillmentDO"]

# FOUR SECRETS, NONE OF THEM HERE. (The fourth, FULFILLMENT_OPS_SECRET, gates
# GET /fulfillment/orders — the operator's read of the paid-order book,
# supplier ids included. It is the FOUNDER'S credential alone and is
# deliberately NOT the intake secret: Shop+ holds the intake secret to
# deliver, and one key must never unlock the other's capability. UNSET ⇒ the
# ops read answers 401 to everyone.)
#
# THREE SECRETS OF THE EARLIER PATTERN, NONE OF THEM HERE. (ORDER-PAID-WIRE-1c added the third:
# FULFILLMENT_WRITE_SECRET gates POST /fulfillment/order-confirmed and the ops
# read GET /fulfillment/orders — the same value Shop+'s storefront-service
# holds and presents as Bearer when delivering order.confirmed.v1. Set with
# `wrangler secret put FULFILLMENT_WRITE_SECRET` on BOTH Workers. UNSET ⇒ the
# intake is 401 and Shop+'s outbox retries hourly until both sides hold it.)
#
# TWO SECRETS OF THE ORIGINAL PATTERN, NEITHER OF THEM HERE. Both are set out-of-band with
# `wrangler secret put` (encrypted, not in the repo) and must NEVER be added to
# [vars]: all five repos are PUBLIC and anything in [vars] is committed and
# published. Both gates fail CLOSED — until each secret is set, the route it
# guards returns 401 by design.
#
#   OFFER_WRITE_SECRET   — SERVICE-WRITE-AUTH. Guards POST /offers (and the
#                          GET /offers admin list). Set it before or right after
#                          deploying, or seeds and the supplier app look broken.
#                          NOTE: this one SHIPS INSIDE THE SUPPLIER APP BUNDLE, so
#                          it stops scanners, not attackers, and is not identity.
#
#   SUPPLY_READ_SECRET   — SUPPLY-READ-AUTH. Guards GET /supply-projection/:pv.
#                          A REAL credential: it never leaves two Workers. The
#                          SAME value must be set on shop-plus's Worker, which
#                          presents it as `Authorization: Bearer`.
#
# THIS COMMENT USED TO END "GET /supply-projection stays open (the wire's read
# side)" — that is no longer true and is corrected here. The projection carries
# basePrice and resellerCommission and product version ids are guessable, so an
# open route handed a supplier's cost structure to anyone who guessed one.
#
# THE FAILURE MODE TO KNOW BEFORE DEPLOYING: a missing or mismatched
# SUPPLY_READ_SECRET produces NO error anywhere. shop-plus treats any non-2xx as
# "undescribable" and OMITS the product, so the vitrine simply empties — silently,
# with both repos green. Verify against the LIVE /supply-projection response after
# deploying, never against a green workflow.
